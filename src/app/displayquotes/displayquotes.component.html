<!-- Title -->
<p class="text-2xl font-extrabold text-gray-900 text-center mb-6 underline">
    Display Quotes Works!
</p>

<!-- Responsive Flexbox Layout -->
<div class="flex flex-wrap justify-center gap-4 p-4">
    @for (qoute of quotes; track qoute) {
        <div class="{{ qoute.author === 'Adolf Hitler' ? 'bg-yellow-200' : 'bg-blue-100' }} 
                    border border-gray-300 rounded-lg shadow-md p-4 w-64 text-center">
            <p class="text-xs text-gray-500">ID: <span class="font-semibold text-gray-800">{{qoute._id}}</span></p>
            <h2 class="text-lg font-extrabold text-blue-900">{{qoute.title}}</h2>
            <p class="text-gray-700 italic text-sm">"{{qoute.quotes}}"</p>
            <p class="text-sm font-medium text-gray-600">Author: <span class="text-black">{{qoute.author}}</span></p>
            <p class="text-xs text-gray-500">Published: {{qoute.published}}</p>
        </div>
    }
</div>
